<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>500万的人生</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@200;300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 主界面 -->
<section id="screen-start" class="screen active">
  <div class="bg"><img src="assets/bg-city-sunrise.jpg" alt="城市日出"></div>
  <div class="overlay"></div>
  <div class="start-content">
    <h1 class="title">500万的人生</h1>
    <p class="subtitle">用一笔意外之财，走完这一生</p>
    <div class="spacer"></div>
    <button id="btn-start" type="button">开始游戏</button>
  </div>
  <div class="credit">制作者 武士芝士</div>
</section>

<!-- API Key 输入 -->
<section id="screen-key" class="screen">
  <div class="key-panel">
    <h2 class="key-title">连接 DeepSeek</h2>
    <div class="key-box">
      <input id="key-input" type="password" autocomplete="off" spellcheck="false" placeholder="输入你的 DeepSeek API Key">
      <button id="btn-submit-key" type="button" title="验证并进入游戏">
        <span class="spinner"></span>
        <span class="arrow">▶</span>
      </button>
    </div>
    <div class="key-error" id="key-error"></div>
    <div class="model-row">
      <label for="model-select">模型</label>
      <select id="model-select">
        <option value="deepseek-v4-flash">deepseek-v4-flash（推荐）</option>
        <option value="deepseek-v4-pro">deepseek-v4-pro</option>
      </select>
    </div>
    <p style="margin-top:10px">
      <a class="key-link" href="https://platform.deepseek.com/api_keys" target="_blank" rel="noopener">获取 DeepSeek API Key</a>
    </p>
    <p class="key-hint" style="margin-top:14px">Key 仅保存在本机浏览器，不会上传到其他服务器</p>
  </div>
</section>

<!-- 游戏列表 -->
<section id="screen-games" class="screen">
  <div class="key-panel">
    <h2 class="key-title">选择人生</h2>
    <div class="game-list">
      <button class="game-card" type="button" data-game="500wan">
        <span class="game-name">500万的人生</span>
        <span class="game-desc">初始现金 500万元</span>
      </button>
      <button class="game-card" type="button" data-game="10trillion">
        <span class="game-name">10万亿的人生</span>
        <span class="game-desc">初始现金 10万亿元</span>
      </button>
      <button class="game-card" type="button" data-game="beggar">
        <span class="game-name">乞丐人生</span>
        <span class="game-desc">身无分文 · 白手起家</span>
      </button>
      <button class="game-card" type="button" data-game="gaokao">
        <span class="game-name">高考人生</span>
        <span class="game-desc">2027年 · 冲刺高考</span>
      </button>
      <button class="game-card" type="button" data-game="sanguo">
        <span class="game-name">三国鼎立</span>
        <span class="game-desc">220年 · 天下三分</span>
      </button>
      <button class="game-card" type="button" data-game="voyage">
        <span class="game-name">大航海时代</span>
        <span class="game-desc">1492年 · 扬帆四海</span>
      </button>
      <button class="game-card" type="button" data-game="ww1">
        <span class="game-name">一战风波</span>
        <span class="game-desc">1914年 · 欧陆烽火</span>
      </button>
      <button class="game-card" type="button" data-game="ww2">
        <span class="game-name">二战风波</span>
        <span class="game-desc">1939年 · 全球战火</span>
      </button>
    </div>
    <p style="margin-top:12px">
      <button class="key-link-btn" id="btn-back-to-key" type="button">更换 API Key</button>
    </p>
  </div>
</section>

<!-- 选择国家（战争游戏） -->
<section id="screen-country" class="screen">
  <div class="key-panel">
    <h2 class="key-title">选择国家</h2>
    <div class="key-box">
      <input id="country-input" type="text" autocomplete="off" spellcheck="false" placeholder="输入国家">
      <button id="btn-submit-country" type="button" title="下一步">▶</button>
    </div>
    <div class="key-error" id="country-error"></div>
    <p class="key-hint" id="country-game-hint" style="margin-top:-2px"></p>
    <p style="margin-top:10px">
      <button class="key-link-btn" id="btn-back-to-name" type="button">返回修改姓名</button>
    </p>
    <p class="key-hint" style="margin-top:14px">输入任意国家（含历史国家、地区名），AI 会分析该国情况</p>
  </div>
</section>

<!-- 玩家姓名输入 -->
<section id="screen-name" class="screen">
  <div class="key-panel">
    <h2 class="key-title">玩家姓名</h2>
    <div class="key-box">
      <input id="name-input" type="text" maxlength="10" autocomplete="off" spellcheck="false" placeholder="输入玩家姓名">
      <button id="btn-submit-name" type="button" title="开始人生">▶</button>
    </div>
    <div class="key-error" id="name-error"></div>
    <p class="key-hint" id="name-game-hint" style="margin-top:-2px">即将开启：500万的人生</p>
    <p style="margin-top:10px">
      <button class="key-link-btn" id="btn-back-to-list" type="button">返回选择游戏</button>
    </p>
    <p class="key-hint" style="margin-top:14px">姓名可选填，留空则以默认方式开始</p>
  </div>
</section>

<!-- 选择学校（高考人生） -->
<section id="screen-school" class="screen">
  <div class="key-panel">
    <h2 class="key-title">就读学校</h2>
    <div class="key-box">
      <input id="school-input" type="text" autocomplete="off" spellcheck="false" placeholder="输入你的学校">
      <button id="btn-submit-school" type="button" title="下一步">▶</button>
    </div>
    <div class="key-error" id="school-error"></div>
    <p class="key-hint" id="school-game-hint" style="margin-top:-2px"></p>
    <p style="margin-top:10px">
      <button class="key-link-btn" id="btn-school-back" type="button">返回修改姓名</button>
    </p>
    <p class="key-hint" style="margin-top:14px">输入你就读的学校，AI 会结合学校情况模拟你的成绩与竞争环境</p>
  </div>
</section>

<!-- 游戏对话界面 -->
<section id="screen-game" class="screen">
  <div class="game-header">
    <div class="header-left">
      <button class="header-btn" id="btn-back-games" type="button">返回选择游戏</button>
      <button class="header-btn" id="btn-restart" type="button">重新开始</button>
    </div>
    <span class="hint" id="game-hint">500万的人生</span>
    <button class="header-btn" id="btn-change-key" type="button">更换 API Key</button>
  </div>
  <div id="dashboard">
    <div class="dash-title">人生仪表盘</div>
    <div class="dash-cards">
      <div class="dash-card">
        <div class="dash-label">时间</div>
        <div class="dash-value" id="dash-date">—</div>
        <div class="dash-bar"><div class="dash-bar-fill" id="dash-year-bar"></div></div>
      </div>
      <div class="dash-card">
        <div class="dash-label">人物</div>
        <div class="dash-value" id="dash-person-name">—</div>
        <div class="dash-sub" id="dash-age-health">年龄 — · 健康 —</div>
        <div class="dash-bar"><div class="dash-bar-fill" id="dash-health-bar"></div></div>
      </div>
      <div class="dash-card" id="dash-money-card">
        <div class="dash-label" id="dash-assets-label">资产</div>
        <div class="dash-value" id="dash-cash">—</div>
      </div>
      <div class="dash-card" id="dash-score-card" style="display:none">
        <div class="dash-label">最近总分</div>
        <div class="dash-value" id="dash-exam-score">—</div>
      </div>
      <div class="dash-card">
        <div class="dash-label" id="dash-chart-label">资产走势</div>
        <div class="chart-wrap"><canvas id="asset-chart"></canvas></div>
      </div>
      <div class="dash-card" id="dash-country" style="display:none">
        <div class="dash-label">国家仪表盘</div>
        <div class="stat-bar"><span>人口</span><div class="bar"><div id="bar-pop"></div></div><em id="val-pop">—</em></div>
        <div class="stat-bar"><span>军力</span><div class="bar"><div id="bar-mil"></div></div><em id="val-mil">—</em></div>
        <div class="stat-bar"><span>财政</span><div class="bar"><div id="bar-fin"></div></div><em id="val-fin">—</em></div>
      </div>
      <div class="dash-card">
        <div class="dash-label">时间轴</div>
        <div class="timeline" id="timeline-dots"></div>
      </div>
    </div>
  </div>
  <div id="chat-log"></div>
  <div class="chat-bar">
    <div class="inner">
      <input id="chat-input" type="text" autocomplete="off" placeholder="写下你的选择……">
      <button id="btn-send" type="button">发送</button>
    </div>
  </div>
</section>

<!-- 人生回顾 -->
<section id="screen-summary" class="screen">
  <div class="summary-panel">
    <h2 class="key-title">人生回顾</h2>
    <div class="summary-profile" id="summary-profile"></div>
    <div class="summary-canvas"><canvas id="life-canvas"></canvas></div>
    <div class="summary-events" id="summary-events"></div>
    <div class="summary-extra" id="summary-achievements"></div>
    <div class="summary-extra" id="summary-regrets"></div>
    <div class="summary-actions">
      <button class="header-btn" id="btn-summary-again" type="button">再来一次</button>
      <button class="header-btn" id="btn-summary-home" type="button">返回主菜单</button>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="js/game.js"></script>
</body>
</html>
